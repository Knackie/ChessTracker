<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <title>♟️ Chess Tracker</title>
  </head>

  <body class="bg-light">
    <div id="navbar"></div>

    <main class="container py-4">
      <section class="hero card border-0 shadow-sm p-4 mb-4 text-white">
        <div class="row align-items-center g-4">
          <div class="col-12">
            <p class="text-uppercase small mb-2 text-warning">Suivi de parties</p>
            <h1 class="display-6 fw-bold mb-3">Chess Tracker</h1>
            <p class="lead mb-0">
              Analyse des résultats, classement et historique des parties jouées avec une vue claire et moderne.
            </p>
          </div>
        </div>
      </section>

      <section class="mb-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 class="h4 mb-0">Classement</h2>
          <a href="classement.html" class="btn btn-sm btn-outline-primary">Voir tout</a>
        </div>
        <div class="row g-3">
          <div class="col-md-4"><div id="First"></div></div>
          <div class="col-md-4"><div id="Second"></div></div>
          <div class="col-md-4"><div id="Third"></div></div>
        </div>
      </section>

      <section>
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 class="h4 mb-0">Historique récent</h2>
          <a href="historique.html" class="btn btn-sm btn-outline-primary">Voir plus</a>
        </div>
        <div id="Historique" class="d-grid gap-3">
          <div id="HistoFirst0"></div>
          <div id="HistoFirst1"></div>
          <div id="HistoFirst2"></div>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="core/config.js"></script>
    <script src="core/player-details.js"></script>
    <script src="core/nav.js"></script>
    <script src="core/index.js"></script>
  </body>
</html>
